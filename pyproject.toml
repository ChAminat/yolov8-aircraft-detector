[project]
name = "yolov8-aircraft-detector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.127.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
]

[tool.black]
line-length = 90
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 90
skip_gitignore = true
known_first_party = ["yolov8_aircraft_detector"]

[tool.flake8]
max-line-length = 90
extend-ignore = "E203, W503"
max-complexity = 12
exclude = [
    ".cache",
    ".venv",
    "venv"
]
